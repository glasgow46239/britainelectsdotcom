  "type": "leaders",
  "source": "site/leaders/",
  "headline": "Who is Britain’s most popular party leader?",
  "among": "Views of party leaders among",
  "dekTail": "The latest from Ben Walker's Britain Elects Poll Tracker.",

  "ranges": [
    {
      "label": "Past 6 months",
      "days": 183
    },
    {
      "label": "Past year",
      "days": 365
    },
    {

      "from": "2024-06-01"
    }
  ],
  "defaultRange": 1,
  "note": "Each leader's line starts when they became party leader. Net rating is the share with a positive view minus the share with a negative view. Weighted local averages of published polls.",

    "match": "popular|leader|burnham|badenoch|farage|davey|polanski",

  }
